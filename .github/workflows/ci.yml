name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 下载 TLC 模型检验器
        run: |
          set -euxo pipefail
          curl -fSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          ls -la tla2tools.jar
          echo "db131ddb48e7004d823bef4493df7b35694babe37505b9d9fa5685e7a331f1f1  tla2tools.jar" | sha256sum -c -
          java -version

      - name: 验证 UnboundedDrain（关闭/排空协议）
        working-directory: docs/proofs
        run: |
          set -euxo pipefail
          java -jar ../../tla2tools.jar -cleanup -config UnboundedDrain.cfg UnboundedDrain.tla

      - name: 验证 ShardedWake（唤醒协议）
        working-directory: docs/proofs
        run: |
          set -euxo pipefail
          java -jar ../../tla2tools.jar -cleanup -config ShardedWake.cfg ShardedWake.tla

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Test (race, 含 fuzz 种子回归)
        run: go test -race -count=1 -timeout 10m ./...

      - name: Vet bench module
        working-directory: bench
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "bench 的 go.mod/go.sum 不是 tidy 状态" && exit 1)
          go vet ./...
