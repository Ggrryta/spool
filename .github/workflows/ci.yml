name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # TLC jar 收录于仓库（sha256: db131ddb…331f1f1），密封化以避免
      # 每次构建从网络拉取的漂移与偶发失败
      - name: 验证 UnboundedDrain（关闭/排空协议）
        working-directory: docs/proofs
        run: |
          set -euxo pipefail
          java -jar ../../tools/tla2tools.jar -cleanup -config UnboundedDrain.cfg UnboundedDrain.tla

      - name: 验证 ShardedWake（唤醒协议）
        working-directory: docs/proofs
        run: |
          set -euxo pipefail
          java -jar ../../tools/tla2tools.jar -cleanup -config ShardedWake.cfg ShardedWake.tla

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Test (race, 含 fuzz 种子回归)
        run: go test -race -count=1 -timeout 10m ./...

      - name: Vet bench module
        working-directory: bench
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "bench 的 go.mod/go.sum 不是 tidy 状态" && exit 1)
          go vet ./...
